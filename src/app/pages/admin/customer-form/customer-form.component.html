<div class="form-container">
  <div class="form-header">
    <h2>{{ isEditing ? 'Editar Cliente' : 'Registrar Nuevo Cliente' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <div *ngIf="error" class="error-message">{{ error }}</div>

    <!-- Nombre -->
    <div class="form-group">
      <label for="firstName">Nombre:</label>
      <input type="text" id="firstName" formControlName="firstName" class="form-input" placeholder="Ingrese el nombre"/>
      <span *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched" class="error-text">
        El nombre es requerido (mínimo 2 caracteres)
      </span>
    </div>

    <!-- Apellido -->
    <div class="form-group">
      <label for="lastName">Apellido:</label>
      <input type="text" id="lastName" formControlName="lastName" class="form-input" placeholder="Ingrese el apellido"/>
      <span *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched" class="error-text">
        El apellido es requerido (mínimo 2 caracteres)
      </span>
    </div>

    <!-- Teléfono -->
    <div class="form-group">
      <label for="phone">Teléfono:</label>
      <input type="tel" id="phone" formControlName="phone"
             class="form-input" placeholder="Ej: 987654321" maxlength="9"
             pattern="[0-9]{9}" />
      <span *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched" class="error-text">
        Debe tener 9 dígitos
      </span>
    </div>

    <!-- Correo -->
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" formControlName="email" class="form-input" placeholder="correo@example.com"/>
      <span *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-text">
        Ingrese un correo válido.
      </span>
    </div>

    <!-- Preferencias -->
    <div class="form-group">
      <label for="preferences">Preferencias:</label>
      <textarea id="preferences" formControlName="preferences" class="form-input" rows="3"
                placeholder="Notas o preferencias (opcional)"></textarea>
    </div>

    <!-- Tipo de Cliente -->
    <div class="form-group">
      <label for="clientType">Tipo de Cliente:</label>
      <select id="clientType" formControlName="clientType" class="form-input">
        <option value="V">VIP</option>
        <option value="R">Regular</option>
        <option value="N">Nuevo</option>
      </select>
    </div>

    <!-- Botones -->
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">
        {{ loading ? (isEditing ? 'Actualizando...' : 'Guardando...') : (isEditing ? 'Actualizar' : 'Guardar') }}
      </button>

      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
    </div>
  </form>
</div>
