<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">

    <div class="sidebar-header">
      <i class="fas fa-user-shield logo"></i>
      <span class="title">Admin Panel</span>

      <button class="collapse-btn" (click)="toggleSidebar()">
        <i class="fas" 
           [class.fa-chevron-left]="!isCollapsed"
           [class.fa-chevron-right]="isCollapsed">
        </i>
      </button>
    </div>

    <nav class="menu">
      <a routerLink="/admin-panel/cliente-lista" routerLinkActive="active" class="menu-item">
        <i class="fas fa-users"></i>
        <span>Clientes</span>
      </a>

      <a routerLink="/admin-panel/producto-lista" routerLinkActive="active" class="menu-item">
        <i class="fas fa-box"></i>
        <span>Productos</span>
      </a>

      <a class="menu-item" (click)="logout()" style="cursor:pointer">
        <i class="fas fa-sign-out-alt"></i>
        <span>Cerrar Sesión</span>
      </a>
    </nav>

  </aside>

  <!-- CONTENIDO -->
  <main class="content" [class.expanded]="isCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>
